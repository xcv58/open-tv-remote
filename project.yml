name: OpenRemote
options:
  bundleIdPrefix: media.jenny
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 5736QK4NZX
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    REMOTE_URL_SCHEME: remotelab
    REMOTE_ACTIVITY_BUNDLE_IDENTIFIER: media.jenny.remotelab.remoteactivity
targets:
  OpenRemote:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - Sources
      - Resources
      - Shared
    dependencies:
      - target: RemoteActivityExtension
        destinationFilters: [iOS]
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Remote Lab
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RemoteURLScheme: $(REMOTE_URL_SCHEME)
        CFBundleURLTypes:
          - CFBundleURLName: $(PRODUCT_BUNDLE_IDENTIFIER)
            CFBundleURLSchemes: [$(REMOTE_URL_SCHEME)]
        NSSupportsLiveActivities: true
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Remote Lab talks to TVs on your Wi-Fi network so it can control them.
        NSBonjourServices:
          - _androidtvremote2._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.jenny.remotelab
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_NAME: Remote Lab
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Resources/OpenRemote-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: Resources/OpenRemote-iOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES

  RemoteActivityExtension:
    type: app-extension
    platform: iOS
    deploymentTarget: "17.0"
    sources: [LiveActivity, Shared, Resources/PrivacyInfo.xcprivacy]
    info:
      path: build/RemoteActivity-Info.plist
      properties:
        CFBundleDisplayName: Remote Lab Shortcut
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        RemoteURLScheme: $(REMOTE_URL_SCHEME)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: $(REMOTE_ACTIVITY_BUNDLE_IDENTIFIER)
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES

  OpenRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [UITests]
    dependencies:
      - target: OpenRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: media.jenny.remotelab.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OpenRemote
schemes:
  OpenRemote:
    build:
      targets:
        OpenRemote: all
  OpenRemoteEyesFreeQA:
    build:
      targets:
        OpenRemote: all
    test:
      config: Debug
      targets: [OpenRemoteUITests]
