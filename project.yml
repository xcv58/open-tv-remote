name: OpenRemote
options:
  bundleIdPrefix: com.natebutler
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    DEVELOPMENT_TEAM: 8S43JJMN6B
    CODE_SIGN_STYLE: Automatic
    MARKETING_VERSION: "1.2.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  OpenRemote:
    type: application
    supportedDestinations: [iOS, macOS]
    deploymentTarget:
      iOS: "17.0"
      macOS: "14.0"
    sources:
      - Sources
      - Resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Open Remote
        LSApplicationCategoryType: public.app-category.utilities
        ITSAppUsesNonExemptEncryption: false
        NSLocalNetworkUsageDescription: Open Remote talks to TVs on your Wi-Fi network so it can control them.
        NSBonjourServices:
          - _androidtvremote2._tcp
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natebutler.freeremote
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        MACOSX_DEPLOYMENT_TARGET: "14.0"
        PRODUCT_NAME: Open Remote
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_ENTITLEMENTS[sdk=macosx*]: Resources/OpenRemote-macOS.entitlements
        CODE_SIGN_ENTITLEMENTS[sdk=iphone*]: Resources/OpenRemote-iOS.entitlements
        ENABLE_HARDENED_RUNTIME[sdk=macosx*]: YES

  OpenRemoteUITests:
    type: bundle.ui-testing
    platform: iOS
    deploymentTarget: "17.0"
    sources: [UITests]
    dependencies:
      - target: OpenRemote
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.natebutler.freeremote.uitests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: OpenRemote
schemes:
  OpenRemote:
    build:
      targets:
        OpenRemote: all
  OpenRemoteEyesFreeQA:
    build:
      targets:
        OpenRemote: all
    test:
      config: Debug
      targets: [OpenRemoteUITests]
